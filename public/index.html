<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZBuilder · Ad Admin</title>
<style>
  :root{
    --bg:#0D0D0D; --surface:#1A1A1A; --card:#252525;
    --accent:#00B4FF; --green:#00FF88; --red:#FF4444;
    --t1:#FFFFFF; --t2:#AAAAAA; --line:#2A2A2A;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--t1);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:940px; margin:0 auto; padding:32px 20px 64px}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:8px}
  h1{font-size:22px; margin:0; letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .badge{font-size:12px; padding:5px 12px; border-radius:999px; background:var(--card); color:var(--t2); border:1px solid var(--line)}
  .badge.on{background:rgba(0,255,136,.12); color:var(--green); border-color:rgba(0,255,136,.4)}
  .badge.off{background:rgba(255,68,68,.12); color:var(--red); border-color:rgba(255,68,68,.4)}
  .sub{color:var(--t2); font-size:13px; margin:0 0 24px}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:20px}
  @media (max-width:760px){ .grid{grid-template-columns:1fr} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px}
  .card h2{font-size:14px; text-transform:uppercase; letter-spacing:.8px; color:var(--t2); margin:0 0 18px}

  label{display:block; font-size:13px; color:var(--t2); margin:0 0 7px}
  input[type=text],input[type=number],input[type=password]{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--t1); font-size:14px; outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--accent)}
  .field{margin-bottom:18px}

  /* toggle */
  .toggle{display:flex; align-items:center; gap:14px; cursor:pointer; user-select:none}
  .track{width:56px; height:30px; border-radius:999px; background:#333; position:relative; transition:background .2s; flex:none}
  .track::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fff; transition:transform .2s}
  .toggle input{display:none}
  .toggle input:checked + .track{background:var(--green)}
  .toggle input:checked + .track::after{transform:translateX(26px)}
  .toggle .lbl{font-size:15px; font-weight:600}

  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  button{
    border:0; border-radius:9px; padding:12px 22px; font-size:14px; font-weight:600;
    cursor:pointer; background:var(--accent); color:#00131C; transition:opacity .15s;
  }
  button:hover{opacity:.85}
  button.ghost{background:var(--card); color:var(--t2); border:1px solid var(--line)}
  button.danger{background:transparent; color:var(--red); border:1px solid rgba(255,68,68,.5)}
  button:disabled{opacity:.5; cursor:not-allowed}

  .msg{font-size:13px; min-height:19px; margin-top:12px}
  .msg.ok{color:var(--green)} .msg.err{color:var(--red)}

  /* preview */
  .previewBox{position:relative; border-radius:12px; overflow:hidden; background:var(--card);
    border:1px solid var(--line); aspect-ratio:16/10; display:flex; align-items:center; justify-content:center}
  .previewBox img{width:100%; height:100%; object-fit:cover; display:block}
  .previewBox .empty{color:var(--t2); font-size:13px; text-align:center; padding:16px}
  .pill{
    position:absolute; top:12px; right:12px; background:rgba(0,0,0,.78);
    color:#fff; font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,.22);
  }
  .code{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:13px;
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#9CC9E8;
    white-space:pre-wrap; word-break:break-all; margin-top:14px}

  /* login */
  #login{max-width:380px; margin:12vh auto; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:30px}
  #login h1{font-size:19px; margin-bottom:6px}
  #login p{color:var(--t2); font-size:13px; margin:0 0 22px}
  #app{display:none}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="login">
  <h1>ZBuilder <span style="color:var(--accent)">·</span> Ad Admin</h1>
  <p>Enter the admin password to manage the fallback ad.</p>
  <div class="field">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••" />
  </div>
  <div class="row">
    <button id="loginBtn">Sign in</button>
  </div>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- ======================= APP ======================= -->
<div id="app">
<div class="wrap">
  <header>
    <h1>ZBuilder <span>·</span> Ad Admin</h1>
    <div class="row">
      <span class="badge" id="statusBadge">…</span>
      <button class="ghost" id="logoutBtn">Log out</button>
    </div>
  </header>
  <p class="sub">
    Config is stored as <b>ad-config.json</b> in GitHub and served to the app from raw.githubusercontent.com.
  </p>

  <div class="grid">
    <!-- ============ SETTINGS ============ -->
    <div class="card">
      <h2>Ad settings</h2>

      <div class="field">
        <label class="toggle">
          <input type="checkbox" id="isActive" />
          <span class="track"></span>
          <span class="lbl" id="activeLbl">Ad active</span>
        </label>
      </div>

      <div class="field">
        <label for="adImageUrl">Ad image URL</label>
        <input type="text" id="adImageUrl" placeholder="https://example.com/banner.png" />
      </div>

      <div class="field">
        <label for="redirectLink">Redirect link (opens on image tap)</label>
        <input type="text" id="redirectLink" placeholder="https://example.com" />
      </div>

      <div class="field">
        <label for="timerSeconds">Skip timer (seconds, 1–120)</label>
        <input type="number" id="timerSeconds" min="1" max="120" step="1" />
      </div>

      <div class="row">
        <button id="saveBtn">Save &amp; publish</button>
        <button class="ghost" id="reloadBtn">Reload</button>
      </div>
      <div class="msg" id="saveMsg"></div>
    </div>

    <!-- ============ PREVIEW ============ -->
    <div class="card">
      <h2>Live preview</h2>
      <div class="previewBox">
        <img id="pvImg" alt="" style="display:none" />
        <div class="empty" id="pvEmpty">No image URL set</div>
        <div class="pill" id="pvPill">Skip in 5</div>
      </div>
      <div class="code" id="rawCode">…</div>
      <div class="row" style="margin-top:14px">
        <a id="rawLink" href="#" target="_blank" rel="noopener">
          <button class="ghost" type="button">Open raw JSON</button>
        </a>
        <span class="sub" style="margin:0" id="commitInfo"></span>
      </div>
    </div>
  </div>
</div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const loginBox = $("login"), appBox = $("app");

  function msg(el, text, ok) {
    el.textContent = text || "";
    el.className = "msg " + (ok ? "ok" : "err");
  }
  function renderBadge(on) {
    const b = $("statusBadge");
    b.className = "badge " + (on ? "on" : "off");
    b.textContent = on ? "● AD ACTIVE" : "○ AD DISABLED";
  }
  function renderPreview(cfg) {
    $("pvPill").textContent = "Skip in " + (cfg.timerSeconds || 5);
    const img = $("pvImg"), empty = $("pvEmpty");
    if (cfg.adImageUrl) {
      img.src = cfg.adImageUrl;
      img.style.display = "block";
      empty.style.display = "none";
      img.onerror = function () {
        img.style.display = "none";
        empty.style.display = "block";
        empty.textContent = "Image failed to load (check URL / CORS)";
      };
    } else {
      img.removeAttribute("src");
      img.style.display = "none";
      empty.style.display = "block";
      empty.textContent = "No image URL set";
    }
    $("rawCode").textContent = JSON.stringify(cfg, null, 2);
    renderBadge(!!cfg.isActive);
    $("activeLbl").textContent = cfg.isActive ? "Ad active" : "Ad disabled";
  }

  function readForm() {
    return {
      isActive: $("isActive").checked,
      adImageUrl: $("adImageUrl").value.trim(),
      redirectLink: $("redirectLink").value.trim(),
      timerSeconds: parseInt($("timerSeconds").value, 10) || 5
    };
  }

  // ---------- auth ----------
  async function checkSession() {
    try {
      const r = await fetch("/api/session", { cache: "no-store" });
      const j = await r.json();
      if (j.ok) { loginBox.style.display = "none"; appBox.style.display = "block"; load(); }
      else { loginBox.style.display = "block"; appBox.style.display = "none"; }
    } catch (e) {
      loginBox.style.display = "block";
      appBox.style.display = "none";
    }
  }

  $("loginBtn").addEventListener("click", doLogin);
  $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

  async function doLogin() {
    const btn = $("loginBtn");
    btn.disabled = true; msg($("loginMsg"), "Checking…", true);
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: $("pw").value })
      });
      const j = await r.json();
      if (j.ok) { checkSession(); }
      else { msg($("loginMsg"), j.error || "Login failed", false); }
    } catch (e) {
      msg($("loginMsg"), "Network error: " + e.message, false);
    } finally { btn.disabled = false; }
  }

  $("logoutBtn").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    checkSession();
  });

  // ---------- load / save ----------
  async function load() {
    msg($("saveMsg"), "");
    try {
      const r = await fetch("/api/config", { cache: "no-store" });
      const j = await r.json();
      if (!j.ok) { msg($("saveMsg"), j.error || "Failed to load", false); return; }
      fill(j.config);
      if (j.rawUrl) $("rawLink").href = j.rawUrl;
      $("commitInfo").textContent = "";
    } catch (e) {
      msg($("saveMsg"), "Network error: " + e.message, false);
    }
  }

  function fill(cfg) {
    $("isActive").checked = !!cfg.isActive;
    $("adImageUrl").value = cfg.adImageUrl || "";
    $("redirectLink").value = cfg.redirectLink || "";
    $("timerSeconds").value = cfg.timerSeconds || 5;
    renderPreview(cfg);
  }

  // live preview while typing
  ["adImageUrl", "timerSeconds", "isActive"].forEach((id) => {
    $(id).addEventListener("input", () => renderPreview(readForm()));
    $(id).addEventListener("change", () => renderPreview(readForm()));
  });

  async function save() {
    const btn = $("saveBtn");
    btn.disabled = true;
    msg($("saveMsg"), "Publishing to GitHub…", true);
    try {
      const r = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ config: readForm() })
      });
      const j = await r.json();
      if (j.ok) {
        fill(j.config);
        msg($("saveMsg"), "Published. App will pick this up within ~5 minutes.", true);
        if (j.commit) $("commitInfo").textContent = "commit " + j.commit.slice(0, 7);
        if (j.rawUrl) $("rawLink").href = j.rawUrl;
      } else {
        msg($("saveMsg"), j.error || "Save failed", false);
      }
    } catch (e) {
      msg($("saveMsg"), "Network error: " + e.message, false);
    } finally { btn.disabled = false; }
  }

  $("saveBtn").addEventListener("click", save);
  $("reloadBtn").addEventListener("click", load);

  checkSession();
})();
</script>
</body>
</html>
